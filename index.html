<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video Agent AI</title><style>*{box-sizing:border-box}body{margin:0;background:#080d1c;color:#eaf2ff;font:16px system-ui,sans-serif}main{max-width:780px;margin:40px auto;padding:20px}h1{font-size:32px;margin-bottom:8px}p{color:#a9b6d1}.panel{background:#131c32;border:1px solid #2c3c5b;border-radius:20px;padding:24px}label{display:block;margin:18px 0 8px;font-weight:600}textarea,select,input{width:100%;padding:13px;background:#0b1426;color:white;border:1px solid #42516e;border-radius:10px;font:inherit}textarea{min-height:120px}button{padding:14px 20px;background:#12d3c0;color:#04151b;font-weight:700;border:0;border-radius:10px;cursor:pointer;width:100%;margin-top:20px}button:disabled{opacity:.5}video{width:100%;margin-top:20px;border-radius:12px}#message{white-space:pre-wrap;overflow-wrap:anywhere}.hint{font-size:13px}a{color:#38d9e9}</style></head><body><main><h1>✦ Video Agent AI</h1><p>Crea vídeos con inteligencia artificial a partir de texto o imágenes.</p><div class="panel"><label for="mode">Tipo de generación</label><select id="mode"><option value="text">Texto a vídeo</option><option value="image">Imagen a vídeo</option></select><div id="imageWrap" hidden><label for="image">Imagen de referencia (máximo 8 MB)</label><input id="image" type="file" accept="image/*"></div><label for="prompt">Describe el vídeo</label><textarea id="prompt" maxlength="2000" placeholder="Un robot futurista camina por una ciudad iluminada de noche, movimiento cinematográfico..."></textarea><label for="ratio">Formato</label><select id="ratio"><option value="16:9">Horizontal 16:9</option><option value="9:16">Vertical 9:16</option></select><button id="generate">Generar vídeo</button><p id="message" role="status"></p><div id="result"></div></div><p class="hint">La generación requiere una cuenta y un modelo compatible de Replicate. El proveedor puede cobrar por cada vídeo.</p></main><script>const mode=document.querySelector('#mode'),imageWrap=document.querySelector('#imageWrap'),button=document.querySelector('#generate'),message=document.querySelector('#message'),result=document.querySelector('#result');mode.onchange=()=>imageWrap.hidden=mode.value!=='image';const sleep=ms=>new Promise(r=>setTimeout(r,ms));button.onclick=async()=>{button.disabled=true;result.replaceChildren();message.textContent='Enviando solicitud...';try{const body=new FormData();body.append('mode',mode.value);body.append('prompt',document.querySelector('#prompt').value);body.append('aspect_ratio',document.querySelector('#ratio').value);const file=document.querySelector('#image').files[0];if(file)body.append('image',file);let response=await fetch('/api/generate',{method:'POST',body});let data=await response.json();if(!response.ok)throw Error(data.error);for(let i=0;i<120&&data.status!=='succeeded'&&data.status!=='failed'&&data.status!=='canceled';i++){message.textContent='Generando vídeo... Puede tardar varios minutos.';await sleep(5000);response=await fetch('/api/predictions/'+encodeURIComponent(data.id));data=await response.json();if(!response.ok)throw Error(data.error)}if(data.status!=='succeeded')throw Error(data.error||'La generación no terminó a tiempo.');const url=typeof data.output==='string'?data.output:Array.isArray(data.output)?data.output.find(x=>typeof x==='string'):data.output?.video||data.output?.url;if(!url)throw Error('El proveedor no devolvió una URL de vídeo compatible.');const video=document.createElement('video');video.controls=true;video.src=url;result.append(video);const link=document.createElement('a');link.href=url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Abrir vídeo generado';result.append(link);message.textContent='Vídeo generado correctamente.';}catch(e){message.textContent='Error: '+e.message}finally{button.disabled=false}};</script></body></html>
